[package]
name = "wg-agents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Claude Code adapter and command agent adapter"

[lints]
workspace = true

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
uuid = { version = "1", default-features = false, features = ["std", "v4"] }
wg-agentspec = { path = "../wg-agentspec" }
wg-proc = { path = "../wg-proc" }

# The scripted `claude` used by the tests: it emits the documented stream-json messages.
[[bin]]
name = "wg-fake-claude"
path = "tests/support/fake_claude.rs"
test = false

[[test]]
name = "sh17_agents"
path = "tests/sh17_agents.rs"
