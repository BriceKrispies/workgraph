[package]
name = "wg-analytics-feature"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "the analytics feature: source extraction for the warehouse (SQL, readers), the metric commands (CLI) and FEATURE"

[lints]
workspace = true

[dependencies]
wg-iface = { path = "../wg-iface" }
clap = { version = "4.5", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions", "env", "string"] }
rpds = "1"
serde_json = { version = "1", features = ["preserve_order"] }
wg-analytics = { path = "../wg-analytics" }
wg-archivespec = { path = "../wg-archivespec" }
wg-hash = { path = "../wg-hash" }
wg-intel-feature = { path = "../wg-intel-feature" }
time = { version = "0.3", default-features = false, features = ["std"] }
wg-json = { path = "../wg-json" }
wg-model = { path = "../wg-model" }
wg-registry = { path = "../wg-registry" }
wg-render = { path = "../wg-render" }
wg-runtime = { path = "../wg-runtime" }
wg-store = { path = "../wg-store" }
wg-rows = { path = "../wg-rows" }
wg-types = { path = "../wg-types" }
wg-tasks = { path = "../wg-tasks" }
wg-validate = { path = "../wg-validate" }
wg-wire = { path = "../wg-wire" }
wg-automation-feature = { path = "../wg-automation-feature" }
