[package]
name = "wg-archivespec"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "pure archive formats: backup manifest and names, workspace JSON Lines, analytics dataset encodings"

[lints]
workspace = true

[dependencies]
arrow-array = "58"
arrow-schema = "58"
parquet = { version = "58", default-features = false, features = ["arrow"] }
serde_json = { version = "1", features = ["preserve_order"] }
wg-json = { path = "../wg-json" }
wg-storecodec = { path = "../wg-storecodec" }
wg-types = { path = "../wg-types" }

[dev-dependencies]
bytes = "1"
