[package]
name = "wg-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "the workgraph binary: clap command tree and handlers"

[lib]
name = "wg_cli"
path = "src/lib.rs"

[[bin]]
name = "workgraph"
path = "src/main.rs"

# Own lint table: the console UTF-8 setup on Windows calls the Windows API, so this crate
# cannot inherit the workspace `unsafe_code = "forbid"`. Keep the clippy rules in step with the root.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[dependencies]
clap = { version = "4.5", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions", "env", "string"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal", "macros"] }
tokio-util = "0.7"
wg-browser = { path = "../wg-browser" }
wg-clispec = { path = "../wg-clispec" }
wg-automation-feature = { path = "../wg-automation-feature" }
wg-decisions = { path = "../wg-decisions" }
wg-tasks-feature = { path = "../wg-tasks-feature" }
wg-registry-feature = { path = "../wg-registry-feature" }
wg-codeparse = { path = "../wg-codeparse" }
wg-json = { path = "../wg-json" }
wg-mcp = { path = "../wg-mcp" }
wg-mcpspec = { path = "../wg-mcpspec" }
wg-render = { path = "../wg-render" }
wg-runtime = { path = "../wg-runtime" }
wg-server = { path = "../wg-server" }
wg-serverspec = { path = "../wg-serverspec" }
ureq = "3.5"
wg-net = { path = "../wg-net" }
wg-uispec = { path = "../wg-uispec" }

[dev-dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
wg-model = { path = "../wg-model" }
wg-types = { path = "../wg-types" }
