[package]
name = "wg-clispec"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "pure half of the CLI: argv rules, the command snapshot, exit codes and error reports"

[lints]
workspace = true

[dependencies]
regex = { version = "1", default-features = false, features = ["std", "unicode-perl", "unicode-case"] }
clap = { version = "4.5", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions", "env", "string"] }
serde_json = { version = "1", features = ["preserve_order"] }
wg-config = { path = "../wg-config" }
wg-json = { path = "../wg-json" }
wg-model = { path = "../wg-model" }
wg-registry = { path = "../wg-registry" }
wg-render = { path = "../wg-render" }
wg-runtimespec = { path = "../wg-runtimespec" }
wg-types = { path = "../wg-types" }
wg-validate = { path = "../wg-validate" }
wg-wire = { path = "../wg-wire" }
