[package]
name = "wg-codeparse"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "tree-sitter symbol extraction for six languages"

[lints]
workspace = true

# Grammar versions match the Python analyser's `uv.lock` (see golden/codeparse/grammars.json).
[dependencies]
wg-codeanalysis = { path = "../wg-codeanalysis" }
tree-sitter = "=0.25.2"
tree-sitter-c-sharp = "=0.23.5"
tree-sitter-go = "=0.25.0"
tree-sitter-javascript = "=0.25.0"
tree-sitter-python = "=0.25.0"
tree-sitter-rust = "=0.24.2"
tree-sitter-typescript = "=0.23.2"

[dev-dependencies]
serde_json = "1"

[lib]
doctest = false
test = false
