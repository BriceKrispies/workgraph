[package]
name = "wg-conformance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "differential runner, normaliser, drivers and coverage report"

[lints]
workspace = true

[dependencies]
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde_json = "1"
wg-json = { path = "../wg-json" }
toml = { version = "0.9", default-features = false, features = ["parse", "serde", "std"] }

[[bin]]
name = "wg-conformance"
path = "src/main.rs"
test = false

# CR-04 runs its own main: the test binary re-runs itself as a fake stdio MCP server, and the test
# harness would write its own lines to the same stdout.
[[test]]
name = "cr04_mcp"
path = "tests/cr04_mcp.rs"
harness = false

[lib]
doctest = false
