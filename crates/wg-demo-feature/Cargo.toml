[package]
name = "wg-demo-feature"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "the demo feature: the end-to-end demonstration and the UI demo data (CLI)"

[lints]
workspace = true

[dependencies]
wg-iface = { path = "../wg-iface" }
clap = { version = "4.5", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions", "env", "string"] }
serde_json = { version = "1", features = ["preserve_order"] }
wg-config = { path = "../wg-config" }
wg-json = { path = "../wg-json" }
wg-registry-feature = { path = "../wg-registry-feature" }
wg-git-feature = { path = "../wg-git-feature" }
wg-runtime = { path = "../wg-runtime" }
wg-render = { path = "../wg-render" }
wg-types = { path = "../wg-types" }
