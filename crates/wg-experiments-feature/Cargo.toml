[package]
name = "wg-experiments-feature"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "the experiments feature: experiments, trials and predictor fits (SQL, readers, FEATURE)"

[lints]
workspace = true

[dependencies]
clap = { version = "4.5", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions", "env", "string"] }
regex = { version = "1", default-features = false, features = ["std", "unicode-perl", "unicode-case"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = { version = "0.9", default-features = false, features = ["parse", "serde", "std"] }
wg-clispec = { path = "../wg-clispec" }
wg-experiments = { path = "../wg-experiments" }
wg-git = { path = "../wg-git" }
wg-gitcore = { path = "../wg-gitcore" }
wg-json = { path = "../wg-json" }
wg-model = { path = "../wg-model" }
wg-proc = { path = "../wg-proc" }
wg-procspec = { path = "../wg-procspec" }
wg-pyrand = { path = "../wg-pyrand" }
wg-registry = { path = "../wg-registry" }
wg-render = { path = "../wg-render" }
wg-runtime = { path = "../wg-runtime" }
wg-runtimespec = { path = "../wg-runtimespec" }
wg-store = { path = "../wg-store" }
wg-tasks-feature = { path = "../wg-tasks-feature" }
wg-telemetry = { path = "../wg-telemetry" }
wg-storecodec = { path = "../wg-storecodec" }
wg-types = { path = "../wg-types" }
wg-validate = { path = "../wg-validate" }
wg-wire = { path = "../wg-wire" }

[dev-dependencies]
rpds = "1"
