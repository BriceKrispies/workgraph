[package]
name = "wg-experiments"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "protocol validation, planner, trials, statistics, predictor"

[lints]
workspace = true

[dependencies]
rpds = "1"
serde_json = { version = "1", features = ["preserve_order"] }
wg-json = { path = "../wg-json" }
wg-pynum = { path = "../wg-pynum" }
wg-pyrand = { path = "../wg-pyrand" }

[dev-dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }
