[package]
name = "wg-git-feature"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "the git feature: the git command group, commit ingestion, attribution and worktree listing (CLI)"

[lints]
workspace = true

[dependencies]
wg-iface = { path = "../wg-iface" }
clap = { version = "4.5", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions", "env", "string"] }
rpds = "1"
serde_json = { version = "1", features = ["preserve_order"] }
wg-codeanalysis = { path = "../wg-codeanalysis" }
wg-codeparse = { path = "../wg-codeparse" }
wg-git = { path = "../wg-git" }
wg-gitcore = { path = "../wg-gitcore" }
wg-json = { path = "../wg-json" }
wg-model = { path = "../wg-model" }
wg-registry = { path = "../wg-registry" }
wg-render = { path = "../wg-render" }
wg-runtime = { path = "../wg-runtime" }
wg-store = { path = "../wg-store" }
wg-rows = { path = "../wg-rows" }
wg-types = { path = "../wg-types" }
wg-wire = { path = "../wg-wire" }
time = { version = "0.3", default-features = false, features = ["std"] }
