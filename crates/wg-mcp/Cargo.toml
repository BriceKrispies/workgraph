[package]
name = "wg-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "MCP server over stdio and Streamable HTTP"

[lints]
workspace = true

[dependencies]
wg-validate = { path = "../wg-validate" }
wg-iface = { path = "../wg-iface" }
axum = { version = "0.8", default-features = false, features = ["tokio", "http1"] }
rmcp = { version = "3.7", default-features = false, features = ["server", "transport-io", "transport-streamable-http-server"] }
futures-util = "0.3"
serde = "1"
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-std", "macros"] }
tokio-util = "0.7"
wg-automation-feature = { path = "../wg-automation-feature" }
wg-exec-feature = { path = "../wg-exec-feature" }
wg-git-feature = { path = "../wg-git-feature" }
wg-stacks-feature = { path = "../wg-stacks-feature" }
wg-decisions = { path = "../wg-decisions" }
wg-tasks-feature = { path = "../wg-tasks-feature" }
wg-git = { path = "../wg-git" }
wg-json = { path = "../wg-json" }
wg-model = { path = "../wg-model" }
wg-registry = { path = "../wg-registry" }
wg-registry-feature = { path = "../wg-registry-feature" }
wg-runtime = { path = "../wg-runtime" }
wg-store = { path = "../wg-store" }
wg-types = { path = "../wg-types" }
wg-wire = { path = "../wg-wire" }

[lib]
doctest = false

[[bin]]
name = "wg-mcp"
path = "src/main.rs"
test = false
