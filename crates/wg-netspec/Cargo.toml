[package]
name = "wg-netspec"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "pure half of wg-net: request building, retry decisions and response parsing for Ollama, OpenAI-compatible and Jira"

