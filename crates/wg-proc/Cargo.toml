[package]
name = "wg-proc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "process spawning, bounded capture, tree termination"

# Own lint table: this crate needs FFI for Job Objects and process groups, so it cannot
# inherit the workspace `unsafe_code = "forbid"`. Keep the clippy rules in step with the root.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[dependencies]
wg-procspec = { path = "../wg-procspec" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[test]]
name = "process"
path = "tests/process.rs"
harness = false
