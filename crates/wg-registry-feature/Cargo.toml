[package]
name = "wg-registry-feature"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "the registry feature: workspaces, projects, repositories, settings and setup (CLI, HTTP, MCP)"

[lints]
workspace = true

[dependencies]
clap = { version = "4.5", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions", "env", "string"] }
serde_json = { version = "1", features = ["preserve_order"] }
wg-clispec = { path = "../wg-clispec" }
wg-agents = { path = "../wg-agents" }
wg-codeparse = { path = "../wg-codeparse" }
wg-config = { path = "../wg-config" }
wg-events = { path = "../wg-events" }
wg-git = { path = "../wg-git" }
wg-git-feature = { path = "../wg-git-feature" }
wg-intel = { path = "../wg-intel" }
wg-json = { path = "../wg-json" }
wg-mcpspec = { path = "../wg-mcpspec" }
wg-model = { path = "../wg-model" }
wg-net = { path = "../wg-net" }
wg-registry = { path = "../wg-registry" }
wg-render = { path = "../wg-render" }
wg-runtime = { path = "../wg-runtime" }
wg-runtimespec = { path = "../wg-runtimespec" }
wg-serverspec = { path = "../wg-serverspec" }
wg-store = { path = "../wg-store" }
wg-rows = { path = "../wg-rows" }
wg-tasks = { path = "../wg-tasks" }
wg-tasks-feature = { path = "../wg-tasks-feature" }
wg-types = { path = "../wg-types" }
wg-validate = { path = "../wg-validate" }
wg-wire = { path = "../wg-wire" }

[dev-dependencies]
rpds = "1"
