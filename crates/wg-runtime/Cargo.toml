[package]
name = "wg-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "effect interpreter, decision cycle, flow drivers, workers"

[lints]
workspace = true

[dependencies]
getrandom = "0.4"
rpds = "1"
serde_json = { version = "1", features = ["preserve_order"] }
tracing = "0.1"
tracing-core = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
wg-config = { path = "../wg-config" }
wg-git = { path = "../wg-git" }
wg-jobs = { path = "../wg-jobs" }
wg-json = { path = "../wg-json" }
wg-model = { path = "../wg-model" }
wg-proc = { path = "../wg-proc" }
wg-registry = { path = "../wg-registry" }
wg-runtimespec = { path = "../wg-runtimespec" }
wg-store = { path = "../wg-store" }
wg-tasks = { path = "../wg-tasks" }
wg-types = { path = "../wg-types" }
