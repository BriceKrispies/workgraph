[package]
name = "wg-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "effect interpreter, decision cycle, flow drivers, workers"

[lints]
workspace = true

[dependencies]
wg-stacks = { path = "../wg-stacks" }
wg-validate = { path = "../wg-validate" }
wg-procspec = { path = "../wg-procspec" }
base64 = "0.22"
wg-iface = { path = "../wg-iface" }
getrandom = "0.4"
time ={ version = "0.3", default-features = false, features = ["std", "local-offset"] }
rpds = "1"
wg-rows = { path = "../wg-rows" }
serde_json = { version = "1", features = ["preserve_order"] }
tracing = "0.1"
tracing-core = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
wg-codeanalysis = { path = "../wg-codeanalysis" }
wg-codeparse = { path = "../wg-codeparse" }
wg-config = { path = "../wg-config" }
wg-render = { path = "../wg-render" }
wg-exec = { path = "../wg-exec" }
wg-git = { path = "../wg-git" }
wg-gitcore = { path = "../wg-gitcore" }
wg-jobs = { path = "../wg-jobs" }
wg-json = { path = "../wg-json" }
wg-events = { path = "../wg-events" }
wg-model = { path = "../wg-model" }
wg-net = { path = "../wg-net" }
wg-proc = { path = "../wg-proc" }
wg-registry = { path = "../wg-registry" }
wg-store = { path = "../wg-store" }
wg-wire = { path = "../wg-wire" }
wg-tasks = { path = "../wg-tasks" }
wg-telemetry = { path = "../wg-telemetry" }
wg-verify = { path = "../wg-verify" }
wg-telemetryspec = { path = "../wg-telemetryspec" }
wg-types = { path = "../wg-types" }
