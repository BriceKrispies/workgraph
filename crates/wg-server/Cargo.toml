[package]
name = "wg-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "axum HTTP API, security middleware, SSE, static UI files"

[lints]
workspace = true

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
rust-embed = "8"
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
wg-json = { path = "../wg-json" }
wg-decisions = { path = "../wg-decisions" }
wg-model = { path = "../wg-model" }
wg-runtime = { path = "../wg-runtime" }
wg-runtimespec = { path = "../wg-runtimespec" }
wg-serverspec = { path = "../wg-serverspec" }
wg-types = { path = "../wg-types" }
wg-validate = { path = "../wg-validate" }
wg-wire = { path = "../wg-wire" }

[dev-dependencies]
rpds = "1"
wg-decisions = { path = "../wg-decisions" }
wg-git-feature = { path = "../wg-git-feature" }
wg-tasks-feature = { path = "../wg-tasks-feature" }
wg-registry-feature = { path = "../wg-registry-feature" }
wg-model = { path = "../wg-model" }
wg-store = { path = "../wg-store" }
