[package]
name = "wg-serverspec"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "pure rules of the HTTP server: security, routing, request validation, pages, SPA, SSE"

[lints]
workspace = true

[dependencies]
hmac = "0.12"
http = "1"
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
subtle = "2"
wg-json = { path = "../wg-json" }
wg-runtimespec = { path = "../wg-runtimespec" }
wg-types = { path = "../wg-types" }
wg-validate = { path = "../wg-validate" }
wg-wire = { path = "../wg-wire" }
