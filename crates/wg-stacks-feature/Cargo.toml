[package]
name = "wg-stacks-feature"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "the stacks feature: a parent task's children integrated on one branch (CLI)"

[lints]
workspace = true

[dependencies]
clap = { version = "4.5", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions", "env", "string"] }
serde_json = { version = "1", features = ["preserve_order"] }
wg-clispec = { path = "../wg-clispec" }
wg-json = { path = "../wg-json" }
wg-registry = { path = "../wg-registry" }
wg-render = { path = "../wg-render" }
wg-runtime = { path = "../wg-runtime" }
wg-stacks = { path = "../wg-stacks" }
wg-store = { path = "../wg-store" }
wg-types = { path = "../wg-types" }
