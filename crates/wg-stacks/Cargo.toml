[package]
name = "wg-stacks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "stack membership, integration queue, verification, landing"

[lints]
workspace = true

[dependencies]
rpds = { version = "1", features = ["serde"] }
serde_json = { version = "1", features = ["preserve_order"] }
wg-types = { path = "../wg-types" }
wg-verify = { path = "../wg-verify" }

[dev-dependencies]
uuid = { version = "1", default-features = false, features = ["std", "serde"] }

[lib]
doctest = false
