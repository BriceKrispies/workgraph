[package]
name = "wg-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "rusqlite connection setup, migrations, row codecs, SQL"

[lints]
workspace = true

[dependencies]
rpds = { version = "1", features = ["serde"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde_json = { version = "1", features = ["preserve_order"] }
wg-json = { path = "../wg-json" }
wg-model = { path = "../wg-model" }
wg-types = { path = "../wg-types" }
