[package]
name = "wg-tasks-feature"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "the tasks feature: task commands, acceptance, claims, links and the task routes and tools (CLI, HTTP, MCP)"

[lints]
workspace = true

[dependencies]
clap = { version = "4.5", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions", "env", "string"] }
rpds = "1"
serde_json = { version = "1", features = ["preserve_order"] }
wg-clispec = { path = "../wg-clispec" }
wg-decisions = { path = "../wg-decisions" }
wg-exec = { path = "../wg-exec" }
wg-experiments = { path = "../wg-experiments" }
wg-git-feature = { path = "../wg-git-feature" }
wg-jobs = { path = "../wg-jobs" }
wg-json = { path = "../wg-json" }
wg-mcpspec = { path = "../wg-mcpspec" }
wg-model = { path = "../wg-model" }
wg-registry = { path = "../wg-registry" }
wg-render = { path = "../wg-render" }
wg-runtime = { path = "../wg-runtime" }
wg-runtimespec = { path = "../wg-runtimespec" }
wg-serverspec = { path = "../wg-serverspec" }
wg-stacks = { path = "../wg-stacks" }
wg-stacks-feature = { path = "../wg-stacks-feature" }
wg-store = { path = "../wg-store" }
wg-storecodec = { path = "../wg-storecodec" }
wg-tasks = { path = "../wg-tasks" }
wg-types = { path = "../wg-types" }
wg-validate = { path = "../wg-validate" }
wg-verify = { path = "../wg-verify" }
wg-wire = { path = "../wg-wire" }

[dev-dependencies]
uuid = { version = "1", default-features = false, features = ["std", "serde"] }
