[package]
name = "wg-tasks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "task lifecycle, dependency graph, task writes, claims, comments"

[lints]
workspace = true

[dependencies]
rpds = { version = "1", features = ["serde"] }
serde_json = { version = "1", features = ["preserve_order"] }
time = { version = "0.3", default-features = false }
wg-hash = { path = "../wg-hash" }
wg-jobs = { path = "../wg-jobs" }
wg-json = { path = "../wg-json" }
wg-registry = { path = "../wg-registry" }
wg-stacks = { path = "../wg-stacks" }
wg-storecodec = { path = "../wg-storecodec" }
wg-validate = { path = "../wg-validate" }
wg-verify = { path = "../wg-verify" }
wg-wire = { path = "../wg-wire" }
wg-model = { path = "../wg-model" }
wg-types = { path = "../wg-types" }

[dev-dependencies]
uuid = { version = "1", default-features = false, features = ["std", "serde"] }
