[package]
name = "wg-tasks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "task lifecycle, dependency graph, task writes, claims, comments"

[lints]
workspace = true

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
wg-model = { path = "../wg-model" }
wg-types = { path = "../wg-types" }

[dev-dependencies]
rpds = { version = "1", features = ["serde"] }
uuid = { version = "1", default-features = false, features = ["std", "serde"] }
