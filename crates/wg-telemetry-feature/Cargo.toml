[package]
name = "wg-telemetry-feature"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "the telemetry feature: hook ingestion, session bindings, subagent runs, retention and the Claude Code commands (SQL, services, CLI, routes, FEATURE)"

[lints]
workspace = true

[dependencies]
clap = { version = "4.5", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions", "env", "string"] }
serde_json = { version = "1", features = ["preserve_order"] }
time = { version = "0.3", default-features = false, features = ["std", "local-offset"] }
wg-clispec = { path = "../wg-clispec" }
wg-json = { path = "../wg-json" }
wg-model = { path = "../wg-model" }
wg-registry = { path = "../wg-registry" }
wg-render = { path = "../wg-render" }
wg-runtime = { path = "../wg-runtime" }
wg-runtimespec = { path = "../wg-runtimespec" }
wg-serverspec = { path = "../wg-serverspec" }
wg-store = { path = "../wg-store" }
wg-storecodec = { path = "../wg-storecodec" }
wg-telemetry = { path = "../wg-telemetry" }
wg-telemetryspec = { path = "../wg-telemetryspec" }
wg-types = { path = "../wg-types" }
wg-validate = { path = "../wg-validate" }
wg-wire = { path = "../wg-wire" }

[dev-dependencies]
wg-tasks-feature = { path = "../wg-tasks-feature" }
rpds = "1"
uuid = { version = "1", default-features = false, features = ["std", "v4"] }
