[package]
name = "wg-trackers-feature"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "the trackers feature: external tracker items of tracked tasks and the tracker CLI (FEATURE)"

[lints]
workspace = true

[dependencies]
clap = { version = "4.5", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions", "env", "string"] }
serde_json = { version = "1", features = ["preserve_order"] }
time = { version = "0.3", default-features = false, features = ["std"] }
wg-clispec = { path = "../wg-clispec" }
wg-jobs = { path = "../wg-jobs" }
wg-json = { path = "../wg-json" }
wg-model = { path = "../wg-model" }
wg-net = { path = "../wg-net" }
wg-netspec = { path = "../wg-netspec" }
wg-render = { path = "../wg-render" }
wg-runtime = { path = "../wg-runtime" }
wg-store = { path = "../wg-store" }
wg-rows = { path = "../wg-rows" }
wg-tasks = { path = "../wg-tasks" }
wg-trackers = { path = "../wg-trackers" }
wg-types = { path = "../wg-types" }
wg-verify-feature = { path = "../wg-verify-feature" }
wg-wire = { path = "../wg-wire" }

[dev-dependencies]
rpds = "1"
serde_json = { version = "1", features = ["preserve_order"] }
