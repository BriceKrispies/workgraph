[package]
name = "wg-uispec"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "pure rules of `workgraph ui open`: URLs, the health probe, the start decision, messages"

[lints]
workspace = true

[dependencies]
wg-iface = { path = "../wg-iface" }
clap = { version = "4.5", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions", "env", "string"] }
serde_json = { version = "1", features = ["preserve_order"] }
wg-json = { path = "../wg-json" }

[lib]
doctest = false
