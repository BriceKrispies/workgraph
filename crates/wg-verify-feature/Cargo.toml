[package]
name = "wg-verify-feature"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "the verification feature: check configs, runs, check results, the failure history and external acceptance (SQL, readers, CLI, FEATURE)"

[lints]
workspace = true

[dependencies]
wg-iface = { path = "../wg-iface" }
clap = { version = "4.5", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions", "env", "string"] }
rpds = "1"
serde_json = { version = "1", features = ["preserve_order"] }
time = { version = "0.3", default-features = false, features = ["std"] }
wg-exec = { path = "../wg-exec" }
wg-git = { path = "../wg-git" }
wg-hash = { path = "../wg-hash" }
wg-jobs = { path = "../wg-jobs" }
wg-proc = { path = "../wg-proc" }
wg-procspec = { path = "../wg-procspec" }
wg-json = { path = "../wg-json" }
wg-model = { path = "../wg-model" }
wg-registry = { path = "../wg-registry" }
wg-render = { path = "../wg-render" }
wg-runtime = { path = "../wg-runtime" }
wg-store = { path = "../wg-store" }
wg-rows = { path = "../wg-rows" }
wg-tasks = { path = "../wg-tasks" }
wg-types = { path = "../wg-types" }
wg-verify = { path = "../wg-verify" }
wg-wire = { path = "../wg-wire" }

[dev-dependencies]
rpds = { version = "1", features = ["serde"] }
serde_json = { version = "1", features = ["preserve_order"] }
