[package]
name = "wg-verify"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "check configs, check selection, outcomes, acceptance"

[lints]
workspace = true

[dependencies]
regex = { version = "1", default-features = false, features = ["std", "unicode-perl", "unicode-case"] }
rpds = { version = "1", features = ["serde"] }
serde_json = { version = "1", features = ["preserve_order"] }
wg-model = { path = "../wg-model" }
wg-types = { path = "../wg-types" }
