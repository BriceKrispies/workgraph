[project]
name = "workgraph"
version = "0.1.0"
description = "Local-first, agent-first engineering control plane: tasks, multi-repo Git intelligence, agent orchestration, MCP and analytics."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Brice", email = "19312865+BriceKrispies@users.noreply.github.com" }
]
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Framework :: FastAPI",
]
dependencies = [
    "alembic>=1.20.0",
    "duckdb>=1.5.6",
    "fastapi>=0.143.3",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "platformdirs>=4.13.3",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.1",
    "rich>=15.0.0",
    "sqlalchemy>=2",
    "sse-starlette>=3.5.0",
    "tomli-w>=1.2.0",
    "tree-sitter>=0.26.0",
    "tree-sitter-c-sharp>=0.23.5",
    "tree-sitter-go>=0.25.0",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-rust>=0.24.2",
    "tree-sitter-typescript>=0.23.2",
    "typer>=0.27.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
workgraph = "workgraph.cli.entry:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workgraph"]
artifacts = ["src/workgraph/api/static/**"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
    "ty>=0.0.89",
]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["web", "src/workgraph/api/static"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes (unused imports, undefined names)
    "I",    # import ordering
    "UP",   # modern Python syntax
    "B",    # bugbear correctness checks
    "C4",   # comprehension hygiene
    "SIM",  # simplifications
    "RUF",  # ruff-specific correctness
    "ANN",  # annotation hygiene
    "PTH",  # pathlib over os.path
    "S",    # security (subprocess, eval, ...)
    "DTZ",  # timezone-aware datetimes
    "T20",  # stray print statements
    "PIE",
    "RET",
    "TID",
    "PL",   # pylint subset
]
ignore = [
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004", "PLR0917",
    "S603",    # subprocess with argument arrays is the intended pattern
    "S607",    # git/claude are resolved from PATH deliberately
    "S608",    # SQL strings are built from allowlisted identifiers only
    "S101",    # internal invariants use assert for type narrowing
    "RET504", "SIM108", "PLC0415", "PLW2901", "RUF012", "ANN401", "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN", "S105", "S106", "S108", "PLR", "T20", "S311", "DTZ", "PTH"]
"src/workgraph/cli/**" = ["T20"]
"src/workgraph/persistence/migrations/**" = ["ANN", "E501"]
"tools/**" = ["T20", "ANN"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument", "fastapi.Depends", "fastapi.Query"]

[tool.ruff.format]
quote-style = "double"

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.environment]
python-version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "slow: long-running integration test",
    "e2e: end-to-end system test",
]
filterwarnings = ["ignore::DeprecationWarning:mcp.*"]

[tool.coverage.run]
source = ["workgraph"]
branch = true
omit = ["src/workgraph/persistence/migrations/*"]

[tool.coverage.report]
show_missing = false
skip_covered = true
